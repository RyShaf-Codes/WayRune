{% extends "base.html" %}

{% block title %}
Create a Campaign
{% endblock %}

{% block content %}

    <h1 class="text-4xl font-bold text-left mt-12">
        Create a Campaign.
    </h1>

    <form method="POST">
        <h2>
            Campaign Name: <input name="campaign_name">
        </h2>

        <h2>
            System: <input name="system">
        </h2>

        <button type="submit" class="cursor-pointer">
            Create Campaign
        </button>
    </form>




{% endblock %}
