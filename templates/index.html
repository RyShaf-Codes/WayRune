{% extends "base.html" %}

{% block title %}
WayRune
{% endblock %}

{% block content %}

    <h1 class="text-4xl font-bold text-center mt-12">
        WayRune
    </h1>

    <div class="max-w-5xl mx-auto px-6">
        <h2 class="text-2xl font-semibold mt-10">
            Your Campaigns
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
            {% for campaign in campaigns %}
                <a href="{{ url_for('campaign_page', campaign_id=campaign[0]) }}">
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-6 hover:bg-slate-800 transition">
                        <p class="text-xl font-bold">
                            {{ campaign[1] }}
                        </p>
                        <p>DM: {{ campaign[2] }}</p>
                        <p>System: {{ campaign[3] }}</p>
                    </div>
                </a>
            {% endfor %}
        </div>
    </div>

{% endblock %}
